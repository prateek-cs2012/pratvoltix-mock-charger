name: pratvoltix

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/pratvoltix
      PORT: "8080"
      PUBLIC_WS_URL: ws://localhost:4200/ocpp
      HEARTBEAT_INTERVAL: "60"
      TARGET_CSMS_URL: ws://host.docker.internal:9101/independent/{stationId}
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

  mock-charger:
    build:
      context: .
      dockerfile: apps/mock-charger/Dockerfile
    restart: unless-stopped
    environment:
      CSMS_URL: ws://api:8080/ocpp
      CONTROL_URL: ws://api:8080/lab-control
      CHARGE_POINT_ID: CP001
      CHARGE_POINT_VENDOR: Pratvoltix
      CHARGE_POINT_MODEL: Lab-One
      SIMULATOR_NAME: Pratvoltix Mock
      SIMULATOR_VERSION: 0.1.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
